<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Roll Club"><title>Roll Club</title><style>
:root{color-scheme:light;--ink:#20211f;--muted:#74756f;--paper:#f5f5f2;--line:#e3e3dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh}main{max-width:480px;margin:auto;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}header{display:flex;align-items:center;gap:12px;margin:4px 0 28px}.logo{width:46px;height:46px;border:2px solid var(--ink);border-radius:13px;background:white;display:grid;place-items:center;font-size:28px}h1{font-size:22px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}.stage{height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;background:#fafaf8;border:1px solid var(--line);border-radius:17px;margin-bottom:20px}.die{width:112px;height:112px;border:3px solid #252621;border-radius:22px;background:white;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13px;gap:4px;box-shadow:0 5px 0 #deded7;animation:appear .18s ease-out}.pip{background:#252621;border-radius:50%;width:100%;height:100%;visibility:hidden}.pip.on{visibility:visible}@keyframes appear{from{transform:rotate(-7deg) scale(.9);opacity:.6}to{transform:rotate(0) scale(1);opacity:1}}.status{font-size:13px;color:var(--muted)}.label{font-size:11px;letter-spacing:1.2px;font-weight:800;color:var(--muted);margin:18px 0 10px;text-transform:uppercase}.options{display:flex;gap:8px}.opt{flex:1;min-height:42px;background:white;border:1px solid var(--line);border-radius:11px;color:var(--ink);font-weight:700;font-size:14px}.opt.active{background:var(--ink);color:white;border-color:var(--ink)}.roll{width:100%;border:0;border-radius:13px;background:var(--ink);color:white;padding:16px;font-size:16px;font-weight:800;margin-top:22px}.summary{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--muted)}.summary strong{font-size:18px;color:var(--ink);margin-left:5px}.title{font-size:15px;font-weight:800}.clear{border:0;background:transparent;color:var(--muted);font-size:13px}.history{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{border:1px solid var(--line);background:#fafaf8;border-radius:10px;padding:9px 11px;font-size:13px}.empty{font-size:13px;color:var(--muted);margin-top:12px}.foot{text-align:center;font-size:12px;color:#888981;padding:8px}</style></head><body><main><header><div class="logo">⚄</div><div><h1>Roll Club</h1><div class="sub">A little roll of chance.</div></div></header><section class="card"><div class="stage" aria-live="polite"><div class="die" id="die"></div><div class="status" id="status">Ready to roll</div></div><div class="label">Number of dice</div><div class="options" id="counts"><button class="opt active" data-count="1">1 die</button><button class="opt" data-count="2">2 dice</button><button class="opt" data-count="3">3 dice</button></div><div class="label">Sides per die</div><div class="options" id="sides"><button class="opt active" data-sides="6">D6</button><button class="opt" data-sides="8">D8</button><button class="opt" data-sides="10">D10</button><button class="opt" data-sides="20">D20</button></div><button class="roll" id="roll">Roll the die</button><div class="summary"><span id="total">Total <strong>—</strong></span><span id="rollcount">0 rolls</span></div></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div class="title">Recent rolls</div><button class="clear" id="clear">Clear</button></div><div class="history" id="history"></div><div class="empty" id="empty">Your recent rolls will appear here.</div></section><div class="foot">Simple. Random. Done.</div></main><script>
const pips={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};let count=1,sides=6,rolls=0,history=[];const $=x=>document.getElementById(x);
function dieFace(n){const d=$("die");d.style.display="grid";d.style.width="112px";d.style.height="112px";d.style.border="3px solid #252621";d.style.padding="13px";d.style.boxShadow="0 5px 0 #deded7";d.style.fontSize="";d.innerHTML="";for(let i=0;i<9;i++){let p=document.createElement("i");p.className="pip"+(sides===6&&pips[n].includes(i)?" on":"");d.appendChild(p)}}
$("counts").onclick=e=>{let b=e.target.closest("[data-count]");if(!b)return;count=+b.dataset.count;document.querySelectorAll("#counts button").forEach(x=>x.classList.toggle("active",x===b));$("roll").textContent=count===1?"Roll the die":"Roll the dice"};
$("sides").onclick=e=>{let b=e.target.closest("[data-sides]");if(!b)return;sides=+b.dataset.sides;document.querySelectorAll("#sides button").forEach(x=>x.classList.toggle("active",x===b));$("status").textContent="Ready to roll a D"+sides;dieFace(1)};
function render(){ $("history").innerHTML=history.map(h=>`<div class="chip">${h.values.join(" + ")} <strong>= ${h.sum}</strong><div style="font-size:11px;color:#74756f;margin-top:3px">D${h.sides}</div></div>`).join("");$("empty").style.display=history.length?"none":"block"}
function roll(){let vals=Array.from({length:count},()=>Math.floor(Math.random()*sides)+1),sum=vals.reduce((a,b)=>a+b,0);rolls++;history.unshift({values:vals,sides,sum});history=history.slice(0,12);if(count===1){dieFace(vals[0])}else{let d=$("die");d.style.display="flex";d.style.width="auto";d.style.height="auto";d.style.border="0";d.style.padding="12px";d.style.boxShadow="none";d.style.fontSize="25px";d.style.fontWeight="800";d.innerHTML="";d.textContent=vals.join(" · ")}$("status").textContent=count===1?`D${sides} · ${vals[0]}`:vals.map(v=>`D${sides}: ${v}`).join("   ");$("total").innerHTML=`Total <strong>${sum}</strong>`;$("rollcount").textContent=rolls+" roll"+(rolls===1?"":"s");render()}
$("roll").onclick=roll;$("clear").onclick=()=>{history=[];rolls=0;render();$("rollcount").textContent="0 rolls"};dieFace(1);
</script></body></html>
